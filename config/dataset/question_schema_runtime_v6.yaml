D1:
  type: noul
  instructions: Does the assistant text so far concern a banking or financial product,
    including credit?
D2:
  type: noul
  instructions: Does the assistant text so far express a product recommendation or
    an opinion intended to influence a product decision?
D3:
  type: noul
  instructions: Does that product advice demonstrably link actual customer objectives,
    financial situation or needs to the recommendation, including a reference resolved
    from earlier turns? Mere product comparison, statement review or information requests
    do not constitute such a basis.
D4:
  type: noul
  instructions: Does that product advice assert or imply suitability for the current
    customer in the full conversation, including a direct selection answering their
    suitability request without requiring a pronoun? A selection addressed to the
    customer after a bare actual disclosure can imply fit even without a question.
    Disclosure alone is insufficient, and a generic request does not override a tailored
    response.
D5:
  type: noul
  instructions: Does the assistant text so far provide substantive facts or procedural
    banking help without product advice? Unendorsed quotations of opinions alone do
    not count as substantive facts.
D6:
  type: noul
  instructions: Does the assistant text so far provide a recommendation or influential
    opinion about a credit product?
D7:
  type: choice
  instructions: What is the classification of the assistant text available so far?
  criteria:
    factual_information: Substantive product facts/procedure without endorsed advice
      in this target.
    general_advice: Endorsed product advice without actual-basis use or individual
      suitability in context.
    personal_advice: Product advice demonstrably using a substantive actual basis
      or asserting/implying individual suitability.
    other: No substantive facts, procedure or endorsed product advice expressed so
      far.
