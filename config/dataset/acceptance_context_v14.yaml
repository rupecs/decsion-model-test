notes:
- Every partition must cover all six product domains plus service and all 20 call
  categories.
- Distinct designs are counted by validated content hash, not renamed IDs or context
  count.
- No bypass flag and no failed draft may be published by the v14 builder.
- Passing construction never approves annotation, native token coverage, GPU smoke
  or training.
- Training snapshot and design shares 60-70%; at least 35 training product topics.
- Each discordant group requires five designs and 15% of personal designs in each
  partition.
